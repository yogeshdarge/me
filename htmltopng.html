<!-- Write your HTML here -->
<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pithori Amavasya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins','Noto Sans Devanagari', sans-serif;
      background: #fff;
      color: #333;
    }

    .top{
    position: absolute;
    top: 2vw;
    left: 0;
    right: 0;
    margin: 4vw;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    }

    .top .logo{
    width: 12vw;
    height: 12vw;
    border-radius: 3.5vw;
    padding:0.25vw;
    overflow: hidden;
    background:#f6f6fa;
    }

    .top .links .link{
    width: 6vw;
    height: 6vw;
    overflow: hidden;
    display: inline-block;
    filter: invert(97%) sepia(0%) saturate(13%) hue-rotate(245deg) brightness(102%) contrast(105%);
    margin: 1vw;
    }

    .top img{
        width: 100%;
        height: 100%;
    }

    .header {
    background: url({{image}}) #14233c no-repeat center top / cover;
    height: 68vw;
    position: relative;
    color: #fff;
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    padding: 2vw;
    z-index: -1;
    border-radius: 0 0 5vw 5vw;
    }

    .header span {
    /*background: rgba(0, 0, 0, 0.6); */
    padding: 4vw 8vw;
    font-size: 3.5vw;
    margin-bottom: 11vw;
    display: flex;
    }

    .header span img {
    width: 5vw;
    height: 5vw;
    overflow: hidden;
    display: inline-block;
    filter: invert(97%) sepia(0%) saturate(13%) hue-rotate(245deg) brightness(102%) contrast(105%);
    margin-right: 1vw;
    }

    .card {
    background: #fff;
    border-radius: 5vw;
    padding: 6vw 2vw 6vw 4vw;
    margin: -15vw 5vw 5vw 5vw;
    box-shadow: 0 4vw 8vw rgba(0, 0, 0, 0.2);
    }

    .date-box {
      display: flex;
      align-items: center;
      gap: 3vw;
    }

    .left {
      text-align: center;
      border-right: 1px solid #ddd;
      padding-right: 4vw;
    }

    .left h3 {
    margin: 0 3vw;
    padding: 0;
    color: black;
    font-weight: normal;
    font-size: 3.5vw;
    }

    .left h1 {
    font-size: 12vw;
    color: #ff6600;
    line-height: 1.1;
    padding: 0;
    margin: 0;
    }

    .left p {
    margin: 0;
    font-size: 3vw;
    color: black;
    }

    .right {
      flex: 1;
      padding-left: 10px;
    }

    .right h3 {
        margin: 0;
    color: #ff6600;
    font-size: 3.5vw;
    line-height: 1.5;
    }

    .right p {
    margin: 1vw 0;
    font-size: 3.25vw;
    color: #444;
    font-weight: 500;
    line-clamp: 1;
    -webkit-line-clamp: 1;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    white-space: normal;
    overflow: hidden;
    }

    .right p.small {
    font-size: 2.75vw;
    line-height: 1.5;
    color: black;
    font-weight: 200;
    }

    .timings {
    display: flex;
    justify-content: flex-start;
    margin-top: 1vw;
    font-size: 3vw;
    color: #222;
    gap: 2vw;
    }

    .timings div {
      display: flex;
      align-items: center;
      gap: 1vw;
    }

    .timings div.moon {
        background: black;
        width: 5vw;
        height: 5vw;
        padding: 0.7vw;
        border-radius: 8vw;
        overflow: hidden;
    }

    .timings div.moon img {
        width: 100%;
        height: 100%;
    }

    .timings div span {
      width: 4vw;
      height: 4vw;
    }


    .timings div span.sunrise {
        filter: invert(77%) sepia(29%) saturate(2851%) hue-rotate(350deg) brightness(106%) contrast(107%);
    }

    .timings div span.sunset {
        filter: invert(60%) sepia(57%) saturate(6693%) hue-rotate(1deg) brightness(103%) contrast(106%);
    }

    .footer {
    text-align: center;
    font-size: 3vw;
    color: #777;
    padding: 2vw 2vw 8vw;
    letter-spacing: 0.07rem;
    font-weight: 400;
    }
    .footer .seperator{
    width: 7vw;
    height: 1vw;
    background: #ff6600;
    display: block;
    margin: 0 auto 3vw;
    border-radius: 3vw;
    }

  </style>
</head>
<body>

<div class="top">
    <div class="logo">
        <img src="https://res.cloudinary.com/anurvik/image/upload/v1740645828/community/images/ic_samuday.png" alt="logo">
    </div>
    <div class="links">
        <div class="link">
            <img src="https://res.cloudinary.com/anurvik/image/upload/v1756034381/community/images/icon-playstore.svg" alt="logo">
        </div>
        <div class="link">
            <img src="https://res.cloudinary.com/anurvik/image/upload/v1756034381/community/images/icon-appstore.svg" alt="logo">
        </div>
    </div>

</div>
  <div class="header">
    {{#enableinfo}}
    <span><img src="https://res.cloudinary.com/anurvik/image/upload/v1756036005/community/images/admin-info.svg" alt="logo"> {{info}}</span>
    {{/enableinfo}}
  </div>

  <div class="card">
    <div class="date-box">
      <div class="left">
        <h3>{{dayname}}</h3>
        <h1>{{day}}</h1>
        <p>{{month}}'{{shortyear}}</p>
      </div>
      <div class="right">
        <h3>{{special}}</h3>
        <p>{{tithione}}</p>
        <p>{{tithitwo}}</p>
        <p class="small">{{tithithree}}</p>
        <div class="timings">
          <div><span class="sunrise"><img src="https://res.cloudinary.com/anurvik/image/upload/v1740645828/community/images/icon-sunrise.svg" alt="logo"></span> {{sunrise}}</div>
          <div><span class="sunset"><img src="https://res.cloudinary.com/anurvik/image/upload/v1740645828/community/images/icon-sunset.svg" alt="logo"></span> {{sunset}}</div>
          <div class="moon"><img src="https://res.cloudinary.com/anurvik/image/upload/v1756035395/community/images/moon/{{moon}}.svg" alt="logo"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="seperator"></div>
    © SAMUDAY INDIA | 2025–2026
  </div>

</body>
</html>
